source = /home/$USER/.cache/wal/colors-hyprland

# Horizontal display (PIN entry)
background {
    monitor = DP-3
    path = $wallpaper
    blur_size = 8
    blur_passes = 4
    brightness = .6
}

input-field {
    monitor = DP-5
    size = 300, 60
    outline_thickness = 2
    inner_color = rgba(20,20,20,0.6)
    outer_color = $color9
    font_color = $color9
    rounding = 12
    dots_spacing = 0.3
    dots_size = 0.4
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor = DP-3
    text = <i>Hello</i> <b>$USER</b>
    color = $color5
    font_size = 40
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 0
    shadow_size = 4
    position = 0, 100
    halign = center
    valign = center
}

# Vertical display (info)
background {
    monitor = DP-1
    path = $wallpaper
    blur_size = 5
    blur_passes = 3
    brightness = .6
}

label {
    monitor = DP-1
    text = cmd[update:1000] date +"<b>%I</b>:<b>%M</b>"
    color = $color9
    font_size = 120
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 0
    shadow_size = 5
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = cmd[update:1000] date +"<b>%A, %B %d, %Y</b>"
    color = $color4
    font_size = 40
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 0
    shadow_size = 4
    position = 0, 350
    halign = center
    valign = center
}

