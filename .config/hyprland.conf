# ============================================================
#  hyprland.conf
#  Arch Linux · AMD RX 6750 XT + Ryzen 7 5700X3D · 240Hz
#  Gaming fixes: Steam + Proton
# ============================================================

source = /home/$USER/.cache/wal/colors-hyprland


# ── Monitors ────────────────────────────────────────────────
# DP-3 → 144Hz, rotacionado 90° (vertical)
# DP-1 → 240Hz, principal
monitor = DP-3, 1920x1080@144.00, 552x0,    1, transform, 3
monitor = DP-1, 1920x1080@240.00, 1632x416, 1.00


# ── Variáveis ────────────────────────────────────────────────
$terminal    = kitty
$fileManager = thunar
$menu        = wofi -n
$mainMod     = SUPER
$osd         = swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')"


# ── Autostart ────────────────────────────────────────────────
exec-once = hyprctl setcursor Bibata-Modern-Classic 12
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprpolkitagent
exec-once = swayosd-server -s ~/.config/swayosd/style.css
exec-once = waybar
exec-once = swaync
exec-once = pypr
exec-once = swaync-client -df
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = pactl set-sink-mute @DEFAULT_SINK@ 0
exec-once = swww-daemon && sleep 1
exec-once = swww restore && ~/.config/hypr/restore-wallpaper.sh


# ── Cursor ───────────────────────────────────────────────────
cursor {
    no_hardware_cursors      = false
    enable_hyprcursor        = true
    sync_gsettings_theme     = true
    warp_on_change_workspace = false
    hide_on_key_press        = false
}


# ════════════════════════════════════════════════════════════
#  Environment Variables
# ════════════════════════════════════════════════════════════

# Wayland / Session
env = XDG_SESSION_TYPE,    wayland
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_DESKTOP, Hyprland

# AMD GPU — backends corretos
env = GBM_BACKEND,               radeonsi
env = LIBVA_DRIVER_NAME,         radeonsi
env = VDPAU_DRIVER,              radeonsi
env = __GLX_VENDOR_LIBRARY_NAME, mesa
env = AMD_VULKAN_ICD,            RADV

# RADV Vulkan — performance flags (Mesa 24+ / 2026)
env = RADV_PERFTEST, gpl
# AMD Debug
#env = AMD_DEBUG,  nodcc
#env = RADV_DEBUG, nohiz

# Mesa thread optimization
#env = mesa_glthread, true

# Toolkit — Wayland nativo
env = GDK_BACKEND,                    wayland,x11,*
env = QT_QPA_PLATFORM,                xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,    1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = SDL_VIDEODRIVER,                x11
env = CLUTTER_BACKEND,                wayland

# Electron / Chromium (VSCode, Discord, Obsidian…)
env = ELECTRON_OZONE_PLATFORM_HINT, x11
env = NIXOS_OZONE_WL,               1

# Cursor
env = XCURSOR_SIZE,    24
env = XCURSOR_THEME,   Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,  24
env = HYPRCURSOR_THEME, Bibata-Modern-Classic

# ── Steam / Proton / Gaming ──────────────────────────────────
# Força Steam a usar Wayland nativo na interface (evita XWayland no client)
env = STEAM_FORCE_DESKTOPUI_SCALING, 1

# Garante que o SDL dos jogos Proton não ignore Wayland
# (CS2 e Source 2 usam SDL3 — isso mantém compatibilidade)
env = SDL_AUDIODRIVER, pipewire

# VKD3D-Proton — habilita ray tracing e melhorias DX12
# (sem RADV_PERFTEST=rt isso não tem efeito — já temos acima)
env = VKD3D_CONFIG, dxr,dxr11

# DXVK async shader compilation — evita stutters no CS2 enquanto shaders compilam
# Nota: async pode causar glitches visuais breves; troque por dxvk_hud=1 para debug

# Força Proton a usar RADV (nunca AMDVLK — pior performance em CS2)
env = DISABLE_LAYER_AMD_SWITCHABLE_GRAPHICS_1, 1

# GameMode — ativa otimizações de CPU/GPU via gamemode daemon
# Requer: pacman -S gamemode; systemctl --user enable --now gamemoded
# Usado automaticamente pelo Proton se instalado; sem necessidade de variável extra


# ════════════════════════════════════════════════════════════
#  Look & Feel
# ════════════════════════════════════════════════════════════

general {
    gaps_in             = 2
    gaps_out            = 10
    border_size         = 0
    col.active_border   = $color9
    col.inactive_border = $color5
    resize_on_border    = true

    # allow_tearing = false aqui — tearing é controlado por janela via windowrule
    # (veja: windowrule = immediate para jogos abaixo)
    allow_tearing       = true

    layout              = dwindle
}

decoration {
    rounding           = 10
    active_opacity     = 0.78
    inactive_opacity   = 0.70
    fullscreen_opacity = 1

    blur {
        enabled        = true
        size           = 3
        passes         = 5
        ignore_opacity = true
        xray           = false
        popups         = true
    }

    shadow {
        enabled      = true
        range        = 15
        render_power = 5
        color        = rgba(0, 0, 0, .5)
    }
}

xwayland {
    force_zero_scaling = true
}


# ════════════════════════════════════════════════════════════
#  Misc — performance e minimalismo
#
#  vfr = true  → reduz frames enviados quando nada muda na
#  tela (idle do desktop). Maior impacto no consumo de CPU/GPU
#  em repouso. Recomendado pelo Hyprland Wiki e FAQ oficial.
# ════════════════════════════════════════════════════════════

misc {
    vfr                      = true
    vrr                      = 0   # deixe 0; o seu monitor não reporta suporte adequado via DP
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    focus_on_activate        = false
    middle_click_paste       = false
}


# ════════════════════════════════════════════════════════════
#  Input — mouse flat, teclado sem delay perceptível
# ════════════════════════════════════════════════════════════

input {
    kb_layout    = en
    follow_mouse = 1
    sensitivity  = 0            # sem modificação de sensibilidade
    accel_profile = flat        # sem aceleração — essencial para gaming/precisão
    numlock_by_default = true
}

binds {
    workspace_back_and_forth = true   # Super+[número atual] volta ao workspace anterior
    allow_workspace_cycles   = true
}


# ════════════════════════════════════════════════════════════
#  Animations — macOS-like · tuned para 240Hz
# ════════════════════════════════════════════════════════════

animations {
    enabled = true

    # Abertura com overshoot leve — macOS spring
    bezier = macOpen,  0.175, 0.885, 0.32, 1.12
    # Fechamento rápido e limpo
    bezier = macClose, 0.4,   0.0,   1.0,  1.0
    # Workspace slide — ease-out quintic com momentum
    bezier = macSlide, 0.22,  1.0,   0.36, 1.0
    # Fade suave
    bezier = macFade,  0.22,  1.0,   0.36, 1.0
    # Layers / overlays com bounce leve
    bezier = macPop,   0.175, 0.885, 0.32, 1.275

    # Window
    animation = windowsIn,   1, 3.5, macOpen,  popin 87%
    animation = windowsOut,  1, 2.0, macClose, popin 87%
    animation = windowsMove, 1, 3.0, macSlide

    # Fade
    animation = fadeIn,     1, 2.5, macFade
    animation = fadeOut,    1, 2.0, macFade
    animation = fadeSwitch, 1, 2.0, macFade
    animation = fadeShadow, 1, 2.0, macFade
    animation = fadeDim,    1, 2.5, macFade

    # Workspaces
    animation = workspaces,       1, 3.5, macSlide, slide
    animation = specialWorkspace, 1, 3.5, macFade,  slidefadevert -35%

    # Layers (waybar, wofi, swaync…)
    animation = layers,    1, 2.5, macSlide, slide
    animation = layersIn,  1, 2.5, macPop
    animation = layersOut, 1, 2.0, macClose
}

# ════════════════════════════════════════════════════════════
#  Layout
# ════════════════════════════════════════════════════════════

dwindle {
    preserve_split = true
}

gesture = 3, horizontal, workspace


# ════════════════════════════════════════════════════════════
#  Window Rules
#
#  Sintaxe nova (Hyprland 0.48+): match:class / match:title
#  windowrulev2 foi depreciado — confirmado no GitHub Jan 2026
#
#  Filosofia minimalista:
#  → Janelas tiled ficam com blur normal (opacidade do decoration)
#  → Fullscreen sempre opaco — não faz sentido blur num jogo
#  → Apps que são opacos por natureza (jogos, vídeo) = opaque
#  → XWayland fix padrão da comunidade
#
#  GAMING:
#  → match:class ^steam_app_ pega TODOS os jogos Steam (steam_app_730, etc.)
#  → match:class ^steam$ pega apenas o cliente Steam
#  → immediate = permite tearing nessa janela (libera FPS máximo no jogo)
#    sem afetar o resto do compositor — requer allow_tearing = true no general
# ════════════════════════════════════════════════════════════

# ── Fullscreen sempre 100% opaco e sem blur desnecessário ──
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:fullscreen on

# ── Kitty: opacidade definida pelo decoration, fullscreen limpo ──
windowrule = opacity 0.78 override 0.70 override 1.0 override, match:class ^kitty$

# ── Thunar: levemente mais opaco que o padrão ──
windowrule = opacity 0.85 override 0.80 override 1.0 override, match:class ^thunar$

# ── Steam — cliente (biblioteca, loja, downloads) ────────────
# match:class ^steam$ pega só a janela principal do Steam,
# sem conflitar com os jogos (steam_app_XXXXX)
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class ^steam$
windowrule = no_blur on,                                       match:class ^steam$

# ── Gamescope: sempre opacos, sem compositing overhead ───────
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class ^gamescope$
windowrule = no_blur on,                                       match:class ^gamescope$
#windowrule = immediate,                                        match:class ^gamescope$

# ── Wofi (launcher): blur nas layers já cuida, janela sem blur extra ──
windowrule = no_blur on, match:class ^wofi$

# ── XWayland fix — evita foco em janelas fantasma ──
#windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# ── Suppress maximize em apps que mandam maximize — quebra o tiling ──
#windowrule = suppressevent maximize, match:class .*


# ════════════════════════════════════════════════════════════
#  Keybindings
# ════════════════════════════════════════════════════════════

# ── Apps ──────────────────────────────────────────────────
bind = $mainMod,       T,      exec, $terminal
bind = $mainMod,       E,      exec, $fileManager
bind = $mainMod,       R,      exec, $menu

# ── Window management ─────────────────────────────────────
bind = $mainMod,       Q,      killactive
bind = $mainMod,       F,      fullscreen
bind = $mainMod,       P,      pseudo
bind = $mainMod,       J,      togglesplit

bind = $mainMod,       V,      exec, hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 800 800; dispatch centerwindow 1;"

# ── Focus ─────────────────────────────────────────────────
bind = $mainMod,       left,   movefocus, l
bind = $mainMod,       right,  movefocus, r
bind = $mainMod,       up,     movefocus, u
bind = $mainMod,       down,   movefocus, d

# ── Move window ───────────────────────────────────────────
bind = ALT,            left,   movewindow, l
bind = ALT,            right,  movewindow, r
bind = ALT,            up,     movewindow, u
bind = ALT,            down,   movewindow, d

# ── Workspaces — ir ───────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ── Workspaces — mover janela ─────────────────────────────
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── Special workspace (scratchpad) ───────────────────────
bind = $mainMod,       S,      togglespecialworkspace, magic
bind = $mainMod SHIFT, S,      movetoworkspace,        special:magic

# ── PyPr toggles ─────────────────────────────────────────
bind = $mainMod,       SPACE,  exec, pypr toggle term
bind = $mainMod,       G,      exec, pypr toggle music
bind = $mainMod,       K,      exec, pypr toggle taskbar
bind = $mainMod,       ESCAPE, exec, pypr toggle spotify

# ── Sistema ───────────────────────────────────────────────
bind = $mainMod,       l,      exec,     hyprlock
bind = $mainMod,       M,      exit
bind = ALT,            TAB,    exec,     wlogout -b 2

# ── Scripts / Utilities ───────────────────────────────────
bind = ALT,            w,      exec, ~/.config/hypr/wallpaper.sh
bind = ALT,            a,      exec, ~/.config/waybar/scripts/refresh.sh
bind = ALT,            B,      exec, ~/.config/waybar/scripts/select.sh
bind = ALT,            r,      exec, ~/.config/swaync/refresh.sh
bind = $mainMod ALT, t, exec, (paplay ~/.config/kittysounds/rezero_death.mp3 &) && kitty

# ── Screenshots ───────────────────────────────────────────
bind = CTRL,           Print,  exec, hyprshot -m region -o ~/Screenshots/
bind = ,               Print,  exec, hyprshot -m window -o ~/Screenshots/
bind = ALT,            Print,  exec, hyprshot -m active -m output -o ~/Screenshots/

# ── Áudio (swayosd) ───────────────────────────────────────
bind = , XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle
bind = , XF86AudioMicMute,      exec, swayosd-client --input-volume mute-toggle
bind = , XF86AudioRaiseVolume,  exec, swayosd-client --output-volume +15
bind = , XF86AudioLowerVolume,  exec, swayosd-client --output-volume -15
bind = , XF86MonBrightnessUp,   exec, swayosd-client --brightness +10
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness -10
bind = , XF86AudioPlay,         exec, swayosd-client --playerctl play-pause
bind = , XF86AudioNext,         exec, swayosd-client --playerctl next
bind = , XF86AudioPrev,         exec, swayosd-client --playerctl previous

# For you Riley
bind = , Caps_Lock, exec, sleep 0.1 && swayosd-client --caps-lock

# ── Mouse ─────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#bind = CTRL, ESCAPE, exec, gksu   # Dont worry about this


# ════════════════════════════════════════════════════════════
#  Layer Rules
# ════════════════════════════════════════════════════════════

# Waybar
layerrule = blur on,          match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar

# SwayNC — notificações e painel
layerrule = blur on,          match:namespace swaync-control-center
layerrule = ignore_alpha .3,  match:namespace swaync-control-center
layerrule = blur on,          match:namespace swaync-notification-window
layerrule = ignore_alpha .3,  match:namespace swaync-notification-window

# Hyprshot — sem animação na seleção de região
layerrule = no_anim on,       match:namespace selection

# SwayOSD — CORRIGIDO: linha estava cortada/quebrada no original
layerrule = blur on,          match:namespace swayosd
layerrule = ignore_alpha 0.5, match:namespace swayosd
